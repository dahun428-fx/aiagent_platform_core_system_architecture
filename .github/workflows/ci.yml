name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Contract, runtime and packaging tests (no UTF-8 mode on purpose)
        run: python -m unittest discover -s tests -v
      - name: Generated portal matches committed files
        run: |
          python scripts/build_portal.py --write
          git diff --exit-code -- portal
