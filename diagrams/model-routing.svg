<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Model Routing / Classification" viewBox="0 0 1140 708"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#397b82"/></marker></defs><rect width="1140" height="708" fill="#f5f7f6"/><style>text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#163638}.title{font-size:27px;font-weight:700}.sub{font-size:16px}.node{font-size:18px;font-weight:700}.detail{font-size:14px}.edge{font-size:13px;paint-order:stroke;stroke:#f5f7f6;stroke-width:5px;stroke-linejoin:round}</style><text x="40" y="42" class="title">Model Routing / Classification</text><rect x="20" y="75" width="165" height="52" rx="5" fill="white" stroke="#397b82"/><text x="102" y="106" text-anchor="middle" class="detail">Runtime</text><path d="M102,127 V678" stroke="#afc5c3" stroke-dasharray="6 6"/><rect x="265" y="75" width="165" height="52" rx="5" fill="white" stroke="#397b82"/><text x="347" y="106" text-anchor="middle" class="detail">Model Gateway</text><path d="M347,127 V678" stroke="#afc5c3" stroke-dasharray="6 6"/><rect x="510" y="75" width="165" height="52" rx="5" fill="white" stroke="#397b82"/><text x="592" y="106" text-anchor="middle" class="detail">Policy</text><path d="M592,127 V678" stroke="#afc5c3" stroke-dasharray="6 6"/><rect x="755" y="75" width="165" height="52" rx="5" fill="white" stroke="#397b82"/><text x="837" y="106" text-anchor="middle" class="detail">Self-hosted</text><path d="M837,127 V678" stroke="#afc5c3" stroke-dasharray="6 6"/><rect x="1000" y="75" width="165" height="52" rx="5" fill="white" stroke="#397b82"/><text x="1082" y="106" text-anchor="middle" class="detail">External</text><path d="M1082,127 V678" stroke="#afc5c3" stroke-dasharray="6 6"/><path d="M102,164 H347" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="224.5" y="154" text-anchor="middle" class="edge">1. Identity + policy + messages</text><path d="M347,230 H592" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="469.5" y="220" text-anchor="middle" class="edge">2. Classification / allowed resources</text><path d="M592,296 H347" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="469.5" y="286" text-anchor="middle" class="edge">3. Approved route set</text><path d="M347,362 H837" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="592" y="352" text-anchor="middle" class="edge">4. Confidential / restricted allowed route</text><path d="M837,428 H347" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="592" y="418" text-anchor="middle" class="edge">5. Canonical response</text><path d="M347,494 H1082" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="714.5" y="484" text-anchor="middle" class="edge">6. Only if classification policy permits</text><path d="M1082,560 H347" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="714.5" y="550" text-anchor="middle" class="edge">7. Normalized response</text><path d="M347,626 H102" stroke="#397b82" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="224.5" y="616" text-anchor="middle" class="edge">8. Result / fail closed if no safe route</text></svg>
